# F31.9.5 — gating CI for every PR + main.
#
# Five jobs:
#   1. lint              — ruff + mypy on the exocortex/ package (non-blocking:
#                          the codebase has a known backlog of findings)
#   2. unit              — pure-Python tests under tests/unit/ (no DB)
#   3. schema-validation — every schema/*.sql applies cleanly on a throwaway PG
#   4. e2e-smoke         — full ingest → synth → compile → query loop
#   5. gate-tools        — unit tests of tools/ (leakgate, simcheck, code_en)
#
# A docs-only PR can skip the slow smoke job by adding the `skip-smoke` label
# (see the `if:` on the e2e-smoke job).
name: CI

on:
  push:
    branches: [main]
    # document-only commits from the publisher change nothing that is built or tested here
    paths-ignore: ['dowody/**']
  pull_request:
    branches: [main]
    paths-ignore: ['dowody/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    # Known lint debt (several hundred ruff findings at import time); the job
    # reports it without blocking merges until the backlog is paid down.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff
        run: ruff check exocortex/ tests/
      - name: mypy
        run: mypy exocortex/

  # ───────────────────────────────────────────────────────────────────────────
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest tests/unit/
        env:
          EXOCORTEX_VAULT_PATH: /tmp/test-vault
        # Three tests are known to fail outside the author's environment (they
        # reach for a database pool or depend on import order); deselected
        # here and tracked as test debt so the rest of the suite gates merges.
        # Coverage floor 25%: pyproject's 40% counts the database-backed
        # integration tests, which this job does not run.
        run: >-
          pytest tests/unit/ -v --color=yes --timeout=60 --cov-fail-under=25
          --deselect tests/unit/test_night_shift_briefing.py::test_build_inputs_assembles_full_payload
          --deselect tests/unit/test_notify_listener.py::test_run_exits_when_telegram_unconfigured
          --deselect tests/unit/test_settings.py::test_module_getattr_raises_attribute_error_without_env

  # ───────────────────────────────────────────────────────────────────────────
  schema-validation:
    name: schema validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PGPASSWORD: exocortex
    steps:
      - uses: actions/checkout@v4
      - name: install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # The project's own database image (Postgres 16 + pgvector + Apache AGE),
      # built and run with rootless Podman, so every migration can be applied.
      - name: build and start the database image
        run: |
          podman build -q -f deploy/postgres-age.Dockerfile -t exocortex-db:ci .
          podman run -d --name db -p 5432:5432 \
            -e POSTGRES_USER=exocortex -e POSTGRES_PASSWORD=exocortex -e POSTGRES_DB=exocortex \
            exocortex-db:ci
          for i in $(seq 1 60); do
            pg_isready -h localhost -U exocortex -d exocortex && break
            sleep 2
          done
      - name: apply every schema/*.sql in order
        # One transaction for all migrations, rolled back at the end: later
        # migrations depend on tables from earlier ones.
        run: |
          set -euo pipefail
          {
            printf 'BEGIN;\n'
            for f in $(ls schema/*.sql | sort); do
              printf '\\echo ── applying %s\n' "$f"
              cat "$f"; printf '\n'
            done
            printf 'ROLLBACK;\n'
          } | psql -h localhost -U exocortex -d exocortex -v ON_ERROR_STOP=1 -q
      - name: database logs (on failure)
        if: failure()
        run: podman logs db | tail -50

  # ───────────────────────────────────────────────────────────────────────────
  e2e-smoke:
    name: e2e smoke (ingest → query)
    runs-on: ubuntu-latest
    # Runs against tests/fakes/fake_llm_server.py: no API key, no cost. The
    # same test runs every night against a real local model (deploy/e2e).
    # PRs labelled `skip-smoke` (docs-only churn etc.) are skipped.
    if: >-
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, 'skip-smoke')
    needs: [unit, schema-validation]
    timeout-minutes: 20
    env:
      E2E_REQUIRE_DB: "1"
      PG_HOST: localhost
      PG_PORT: "5432"
      PG_USER: exocortex
      PG_PASSWORD: exocortex
      PG_DATABASE: exocortex
      PG_AGE_GRAPH: exocortex
      DATABASE_URL: postgresql://exocortex:exocortex@localhost:5432/exocortex
      TENANT_ID: 00000000-0000-0000-0000-000000000001
      EXOCORTEX_LLM_ROUTING: config/llm_routing.selfhosted.yaml
      LOCAL_LLM_API_KEY: fake
      OPENAI_API_KEY: fake
      OPENAI_BASE_URL: http://127.0.0.1:8080/v1
      EXOCORTEX_EMBEDDING_MODEL: bge-m3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: build and start the database image
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          podman build -q -f deploy/postgres-age.Dockerfile -t exocortex-db:ci .
          podman run -d --name db -p 5432:5432 \
            -e POSTGRES_USER=exocortex -e POSTGRES_PASSWORD=exocortex -e POSTGRES_DB=exocortex \
            exocortex-db:ci
          for i in $(seq 1 60); do pg_isready -h localhost -U exocortex -d exocortex && break; sleep 2; done

      - name: install exocortex + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: start the fake LLM server
        run: |
          nohup python tests/fakes/fake_llm_server.py --port 8080 > fake-llm.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/v1/models && break; sleep 1; done

      - name: run e2e smoke
        run: timeout 480 pytest tests/integration/test_end_to_end_mvp.py -v --color=yes --no-cov -p no:cacheprovider

      - name: logs (on failure)
        if: failure()
        run: |
          podman logs db 2>&1 | tail -50
          tail -50 fake-llm.log

  # ───────────────────────────────────────────────────────────────────────────
  gate-tools:
    name: gate tools tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install tool deps
        run: pip install -r tools/requirements.txt
      - name: pytest tools/tests
        # addopts from pyproject.toml configure coverage of the engine; not
        # wanted here.
        run: pytest tools/tests -q -o addopts=""
