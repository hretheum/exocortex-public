[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exocortex-llm-router"
version = "0.1.1"
description = "Provider-agnostic LLM call_tool router with yaml routing, fallback chains, and cost telemetry."
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Eryk Orłowski" }]
dependencies = [
    "anthropic>=0.39",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["llm_router"]
