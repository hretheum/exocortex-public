# config/tag_taxonomy.yaml: vocabulary for LLM tag extraction.
#
# Five axes:
#   client    who (organisation or internal team). Mirrors config/projects.yaml clients[].slug.
#   project   what exactly is being built. Mirrors clients[].projects[].slug.
#   activity  kind of work (closed vocabulary).
#   topic     semantic topic (dynamic vocabulary; the LLM may propose `new:*`).
#   status    operational signal (closed vocabulary).
#
# Entry schema:
#   tag: <slug>          # canonical kebab-case slug
#   display_name: <str>
#   description: <str>   # when to use it
#   aliases: [<str>]     # optional synonyms, including Polish words found in notes
#   domain: <work|frp|3d|ha|cross|generic>
#
# client and project entries must stay in sync with projects.yaml, otherwise
# the classifier drifts. All organisations here are fictional.

# --- client ---
client:
  - tag: acme
    display_name: "Acme Corp"
    description: "Client (fictional example)."
    aliases: ["acme-corp", "sync-acme"]
    domain: work
  - tag: globex
    display_name: "Globex"
    description: "Client (fictional example)."
    aliases: ["sync-globex"]
    domain: work
  - tag: initech
    display_name: "Initech"
    description: "Client (fictional example)."
    aliases: ["initech-intro"]
    domain: work
  - tag: example-company
    display_name: "Example Company (internal)"
    description: "Internal team (fictional example)."
    aliases: ["internal"]
    domain: work

