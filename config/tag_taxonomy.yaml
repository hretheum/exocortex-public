# config/tag_taxonomy.yaml — initial vocabulary dla LLM tag extraction (F3, Strategia F).
# Source: docs/wiki-tag-extraction-analysis.md sekcja 3 + 7.5 (eksperyment z 5 sample meetings).
#
# 5-axis taxonomy:
#   client    — kto (firma / wewnętrzny silos). Mirror config/projects.yaml::clients[].slug.
#   project   — co konkretnego budujemy. Mirror config/projects.yaml::clients[].projects[].slug.
#   activity  — typ pracy (closed vocab — z type_tags i hashtag aggregation).
#   topic     — temat semantyczny (dynamic vocab — LLM może proponować `new:*`).
#   status    — sygnał operacyjny (closed vocab — keyword + LLM disambiguation).
#
# Schema każdego wpisu:
#   tag: <slug>          # kebab-case, kanoniczny
#   display_name: <str>  # human-readable
#   description: <str>   # kiedy stosować
#   aliases: [<str>]     # opcjonalne — synonimy / wcześniejsze warianty
#   domain: <work|frp|3d|ha|cross|generic>
#
# Mutability:
#   - client/project: SYNC z projects.yaml (zmiana tu = zmiana tam, inaczej classifier dryfuje).
#   - activity/status: closed vocab — dodawać manualnie po review queue.
#   - topic: dynamic — extract_tags_batch.py akceptuje `new:*` flagi → review → manual append.
#
# Last sync: 2026-05-02 (F3.1 — initial seed).

