# config/projects.yaml — registry klientów / sub-projektów / person tags / type tags
# Single source of truth dla classifier.py (workers/classifier.py).
# Source: docs/wiki-synthesis-projects-mapping.md (sesja 2026-05-01).
#
# Schema:
#   clients: list[Client]
#     Client:
#       slug: str          # kanoniczny slug (kebab-case), używany w wiki paths
#       display_name: str  # human-readable
#       aliases: list[str] # wszystkie slug fragments rozpoznawalne w filename slug
#                          # (np. dla acme: ["acme", "wks-acme", "acme-bank"])
#       type: external | internal
#       domain: work       # rezerwa pod przyszłą wielodomenową logikę
#       projects: list[Project]  # opcjonalna lista sub-projektów; zawsze jest fallback {slug}-general
#         Project:
#           slug: str           # client_slug + "-" + project_token (np. "acme-kantor")
#           display_name: str
#           aliases: list[str]  # filename-slug tokens lub frazy do dopasowania
#           body_match: list[str]  # opcjonalne — keywords do overlay na metadata.overview
#           min_meetings: int      # opcjonalne — próg dla wygenerowania osobnej strony (default 3)
#
# Convention: PRIMARY MATCH = filename slug. Body overlay = WARSTWA B (tylko gdy
# project=general dla danego klienta). LLM-classified tags (F3) overrideują warstwę
# deterministic tylko jeśli confidence >= 0.7 (logika w extract_tags_batch.py).
#
# Ostatni unmapped review: 2026-05-02 (po pierwszym uruchomieniu autodiscovery).

