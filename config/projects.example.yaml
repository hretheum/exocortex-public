  # ─────────────────────────── Klienci pojawiający się tylko we wzmiankach ──
  # tvp, wayne, bank-pocztowy — pojawiają się w action_items / Notes innych meetingów,
  # ale BRAK osobnych meetingów (z mapping doc). Pominięte w `clients` aby
  # autodiscovery flagowało je gdy realnie będzie pierwszy meeting.

# Person tags — slugi które są LUDŹMI (nie projektami).
# Mapping: tag/filename-alias → person_slug w wiki/work/people/.
# Slugi dopasowane do żywego vault (`_slug_from_email` na emailach example-company:
# jkowalski@example.com → jkowalski; tlis@... → tlis; bwojcik@... → bwojcik).
# `aliases` to filename-slug tokens (jak w client/project) — classifier matchuje je
# żeby rozpoznać meetingi typu `121-user-colleague`, `weekly-partner` jako person-only.
person_tags:
  adamn:
    person_slug: jkowalski
    display_name: Adam Nowicki
    aliases: [adamn, adamn-biweekly]
  piotr:
    person_slug: bwojcik
    display_name: Piotr Wilk
    aliases: [121-user-colleague, weekly-partner, 1on1-user-partner]
  lis:
    person_slug: tlis
    display_name: Tomasz Lis
    aliases: [tomasz-l-bi-weekly, tomasz-lis, lis-biweekly]

# Type tags — slugi opisujące TYP spotkania (nie projekt, nie osobę).
# Te tagi NIE generują clients/ ani projects/ pages, ale tworzą by-tag/ MOC
# i ustawiają meeting.frontmatter.meeting_type.
type_tags:
  - wks            # weekly cliento sync (status meeting)
  - weekly         # synonim wks dla niektórych klientów
  - presales       # sales/business dev
  - internal       # wewnętrzne EFI (bez klienta)
  - leadership     # board / leadership
  - 1on1           # one-on-one
  - wow            # WOW workshops
  - workshop       # warsztat (general)
  - kickoff        # kickoff meeting
  - debriefing     # post-mortem / review
