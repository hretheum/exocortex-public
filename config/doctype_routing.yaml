# zadanie-9 — klasyfikacja typu dokumentu i routing ekstrakcji JAKO DANE.
# Zmiana progu, wzorca ścieżki albo przypisania typ→konfiguracja to edycja
# tego pliku, zero zmian w kodzie (scripts/doctype_classifier.py czyta
# wszystko stąd). Uzasadnienie wartości: docs/ekstrakcja/TYPOLOGIA.md.

classifier:
  # Reguła 1 — jałowy/szkielet (sprawdzana pierwsza; 12/13 recall,
  # 0 fałszywych alarmów na etykietach z zadań 5-7).
  skeleton:
    template_marker: "{{"
    max_len_with_tbd: 900
    min_tbd_count: 1
    hard_min_len: 150
    # v3 (dostrojone na control-30, walidowane na świeżym control-20):
    # hub linków / czysta taksonomia — brak choćby jednej linii prozy
    # przy krótkim dokumencie => nie ma czego ekstrahować.
    max_len_no_prose: 1000
    min_prose_line_len: 60
  # Reguła 2 — techniczny po ścieżce (21/21 na etykietach). Dokument
  # niebędący szkieletem, którego vault_path zawiera którykolwiek wzorzec,
  # jest techniczny; reszta tezowa.
  technical_path_patterns:
    - "/howto/"
    - "_archiwum"
    - "99_ARCHIVE"

# Routing: typ -> konfiguracja ekstrakcji (nazwy configów ze stanowiska
# pomiarowego, bench_configs). Uzasadnienie przypisań: WYNIKI-V3.md
# (odwrócenie werdyktu) + TYPOLOGIA.md (asymetria błędu).
routing:
  jalowy: null                     # nie ekstrahować wcale
  techniczny: terse-qwen36-chunk   # lokalny, $0, precyzja 0,761 na tym typie
  tezowy: terse-gemini36flash-doc  # zdalny, ~$0,03/dok., precyzja 0,720; WYMAGA anonimizacji (parawan)
