# second-brain-instance routing config for llm_router v0.1.x.
#
# Hybrid routing based on an LLM cost analysis + Qwen catalog research:
# - F3 tag extraction + F7.2 generated FRP stay on Anthropic (closed enums,
#   creative PL, prompt cache load-bearing).
# - Everything else (synthesis, news aggregator, cross-domain matcher, F6.3
#   processors) routes to DeepInfra Qwen 3.5-397B-A17B (cheaper + better PL
#   for prose-heavy use cases per user feedback "stiff PL" on the aggregator).
# - Anthropic claude-haiku is the universal fallback.
#
# Schema mapping is automatic in the router (Anthropic native ↔ OpenAI compat).

providers:
  anthropic:
    api_key_env: ANTHROPIC_API_KEY
    default_model: claude-haiku-4-5-20251001
    pricing:
      input: 1.00            # USD per Mtok
      output: 5.00
      cache_write: 1.25
      cache_read: 0.10

  deepinfra:
    api_key_env: DEEPINFRA_API_KEY
    base_url: https://api.deepinfra.com/v1/openai
    default_model: Qwen/Qwen3.5-397B-A17B
    pricing:
      input: 0.54
      output: 3.40

  openrouter:
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    default_model: anthropic/claude-haiku-4.5
    pricing:
      input: 0.60
      output: 3.80
    headers:
      HTTP-Referer: https://github.com/exocortex-workspace/second-brain-instance
      X-Title: second-brain

defaults:
  primary: { provider: deepinfra, model: Qwen/Qwen3.5-397B-A17B }
  fallback:
    - { provider: openrouter, model: qwen/qwen3.5-397b-a17b }
    - { provider: anthropic, model: claude-haiku-4-5-20251001 }
  cost_stop_per_call_usd: 0.50

use_cases:
  # ── Catch-all when caller forgets _use_case ───────────────────────────────
  default:
    primary: { provider: deepinfra, model: Qwen/Qwen3.5-397B-A17B }
    fallback:
      - { provider: openrouter, model: qwen/qwen3.5-397b-a17b }
      - { provider: anthropic, model: claude-haiku-4-5-20251001 }
    cost_stop_per_call_usd: 0.10

  # ── F3 tag extraction (closed taxonomy, prompt cache load-bearing) ────────
  # Keep on Anthropic until F2 shadow proves Qwen wins on quality AND cost.
  second_brain.F3_tag_extraction:
    primary: { provider: anthropic, model: claude-haiku-4-5-20251001 }
    fallback:
      - { provider: deepinfra, model: Qwen/Qwen3.5-397B-A17B }
    cost_stop_per_call_usd: 0.05

  second_brain.F3_auto_tag_tasks:
    primary: { provider: anthropic, model: claude-haiku-4-5-20251001 }
    fallback:
      - { provider: deepinfra, model: Qwen/Qwen3.5-397B-A17B }
