# Live sections registry — sections without a natural vault file
# (e.g. _home.md sections, dashboards, aggregates).
#
# Runtime state (lastRunAt, lastRunSummary) is stored in live_section_runs
# table, not in the target file (which is regenerated by wiki_compiler).
#
# Trigger types:
#   cron       — cron expression (uses croniter)
#   window     — once per day within start-end time range (HH:MM)
#   event      — when matching event arrives (substring match on event source)
#   manual     — only via trigger_live_section MCP tool

sections:
  - id: home-news-pulse
    target_file: wiki/_home.md
    instruction: "Show top newsletter insights from the last 7 days, grouped by category"
    triggers:
      - type: event
        match: "newsletter_processed"
    section: "## Newsletter pulse"
    active: true

  - id: home-today
    target_file: wiki/_home.md
    instruction: "Show today's tasks, clients, projects and tags"
    triggers:
      - type: event
        match: "work_meeting_ingested"
      - type: window
        start: "06:00"
        end: "09:00"
    section: "## Today"
    active: true

  # F21.5 — ACME Notion dashboard. The notion_task processor emits a
  # `notion_acme_updated` event after each sync cycle (~15 min cadence); that
  # event recompiles compile_acme_dashboard() which splices the `## 📋 Projekty
  # (Notion)` block into wiki/work/clients/acme.md. The daily cron is a safety
  # net (e.g. if an event was missed). Dispatched via live_sections.py
  # _run_registry_section → domain_map['acme-dashboard'] = 'acme'.
  - id: acme-dashboard
    target_file: wiki/work/clients/acme.md
    instruction: "ACME project dashboard from Notion + cross-reference with the roadmap"
    triggers:
      - type: event
        match: "notion_acme_updated"
      - type: cron
        expression: "0 6 * * *"   # daily safety net 06:00 UTC
    section: "## 📋 Projekty (Notion)"
    active: true

  # F30 — per-project pages for the ACME portfolio.
  # Dispatched via live_sections.py _run_registry_section →
  # domain_map['acme-projects-dashboard'] = 'acme-projects' →
  # workers.compile_acme_projects.compile_acme_projects(). Regenerates 12
  # per-project Markdown pages + _index.md dashboard. Event-driven (post-sync)
  # + daily safety net 06:00 UTC + manual trigger via MCP.
  - id: acme-projects-dashboard
    target_file: wiki/work/projects/acme/_index.md
    instruction: "Per-project pages for the ACME portfolio from Notion tasks + F4 syntheses"
    triggers:
      - type: event
        match: "notion_acme_updated"
      - type: cron
        expression: "0 6 * * *"   # daily safety net 06:00 UTC
    section: ""                   # full-file rewrites, no H2 splice
    active: true
