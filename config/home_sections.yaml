# wiki/_home.md — section ordering config
#
# Reorder or comment out a section to hide it. The next compile
# (manual or the daily 04:00 UTC cron) applies the change. No code change needed.
#
# The header with counters (last refresh / thoughts / edges / active domains)
# is ALWAYS first — not configurable via yaml.
#
# Available section IDs (from `_HOME_SECTION_RENDERERS` in `workers/wiki_compiler.py`):
#   today           ⚡ Today (Tasks plugin live query for "my" tasks)
#   news_pulse      📰 Newsletter pulse — last 7 days (top 3 categories with claims)
#   cross_domain    🌐 Cross-domain signals (top 5, last 14d)
#   per_domain      🔥 What's happening per domain (recent 7d table)
#   open_questions  ❓ Open questions (from work syntheses, last 30d)
#   reading_queue   🎯 Reading queue (FRP top 5 from DB content_queue)
#   operacyjne      🛠️ Operational (sanity / last compile / 7d LLM cost)
#   quick_nav       🗂️ Quick nav (links to per-domain MOCs)
#   pinned          📌 Pinned (manual) — visible heading + how-to instruction
#
# Missing file OR empty `sections:` = default order (below).

sections:
  - today
  - news_pulse
  - cross_domain
  - per_domain
  - open_questions
  - reading_queue
  - operacyjne
  - quick_nav
  - pinned
