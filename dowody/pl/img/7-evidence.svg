<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 601" class="ig" role="img" aria-label="Schemat: czterostopniowa ścieżka dowodowa, od zapowiedzi, przez dane i wynik, do raportu. Każdy może powtórzyć kroki drugi i trzeci." width="520" height="601" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Schemat: czterostopniowa ścieżka dowodowa, od zapowiedzi, przez dane i wynik, do raportu. Każdy może powtórzyć kroki drugi i trzeci.</title><style>.ig{--bg:#F3F5F8;--surface:#FFFFFF;--ink:#172033;--muted:#566079;--line:#CBD3E0;--priv:#3B4A78;--priv-t:#E3E8F6;--priv-x:#2F3D68;--pub:#0B8A78;--pub-t:#DAF2EE;--pub-x:#06695B;--gate:#C77700;--gate-t:#FCEFD2;--gate-x:#8A5200;--ok:#2B8A4B;--ok-t:#DDF2E4;--ok-x:#1E6B38;--on:#FFFFFF}
@media (prefers-color-scheme: dark){.ig{--bg:#0E1320;--surface:#161D2E;--ink:#E9EDF6;--muted:#A4AEC6;--line:#2E3852;--priv:#93A6E8;--priv-t:#1E2746;--priv-x:#B3C0F0;--pub:#3CC7B1;--pub-t:#12393A;--pub-x:#5ED8C4;--gate:#F0B429;--gate-t:#3A2F10;--gate-x:#F5C65A;--ok:#55C17C;--ok-t:#163A25;--ok-x:#7BD69A;--on:#0E1320}}
