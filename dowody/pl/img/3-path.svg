<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 926" class="ig" role="img" aria-label="Schemat: droga hipotezy w siedmiu krokach, od sygnału, przez kartę hipotezy zamrożoną przed pomiarem i dwie bramki, do planu dla dużej organizacji." width="520" height="926" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Schemat: droga hipotezy w siedmiu krokach, od sygnału, przez kartę hipotezy zamrożoną przed pomiarem i dwie bramki, do planu dla dużej organizacji.</title><style>.ig{--bg:#F3F5F8;--surface:#FFFFFF;--ink:#172033;--muted:#566079;--line:#CBD3E0;--priv:#3B4A78;--priv-t:#E3E8F6;--priv-x:#2F3D68;--pub:#0B8A78;--pub-t:#DAF2EE;--pub-x:#06695B;--gate:#C77700;--gate-t:#FCEFD2;--gate-x:#8A5200;--ok:#2B8A4B;--ok-t:#DDF2E4;--ok-x:#1E6B38;--on:#FFFFFF}
@media (prefers-color-scheme: dark){.ig{--bg:#0E1320;--surface:#161D2E;--ink:#E9EDF6;--muted:#A4AEC6;--line:#2E3852;--priv:#93A6E8;--priv-t:#1E2746;--priv-x:#B3C0F0;--pub:#3CC7B1;--pub-t:#12393A;--pub-x:#5ED8C4;--gate:#F0B429;--gate-t:#3A2F10;--gate-x:#F5C65A;--ok:#55C17C;--ok-t:#163A25;--ok-x:#7BD69A;--on:#0E1320}}
.ig .f-bg{fill:var(--bg)}.ig .f-surf{fill:var(--surface)}.ig .f-ink{fill:var(--ink)}
.ig .f-mut{fill:var(--muted)}.ig .f-on{fill:var(--on)}.ig .f-line{fill:var(--line)}
.ig .s-line{stroke:var(--line)}.ig .s-mut{stroke:var(--muted)}.ig .s-ink{stroke:var(--ink)}.ig .s-on{stroke:var(--on)}
.ig .nf{fill:none}
.ig .tb{font-family:var(--font-body,'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif)}
.ig .td{font-family:var(--font-display,'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif)}
.ig .tm{font-family:var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)}
.ig .f-priv{fill:var(--priv)}.ig .f-privt{fill:var(--priv-t)}.ig .f-privx{fill:var(--priv-x)}.ig .s-priv{stroke:var(--priv)}.ig .s-privx{stroke:var(--priv-x)}
.ig .f-pub{fill:var(--pub)}.ig .f-pubt{fill:var(--pub-t)}.ig .f-pubx{fill:var(--pub-x)}.ig .s-pub{stroke:var(--pub)}.ig .s-pubx{stroke:var(--pub-x)}
.ig .f-gate{fill:var(--gate)}.ig .f-gatet{fill:var(--gate-t)}.ig .f-gatex{fill:var(--gate-x)}.ig .s-gate{stroke:var(--gate)}.ig .s-gatex{stroke:var(--gate-x)}
.ig .f-ok{fill:var(--ok)}.ig .f-okt{fill:var(--ok-t)}.ig .f-okx{fill:var(--ok-x)}.ig .s-ok{stroke:var(--ok)}.ig .s-okx{stroke:var(--ok-x)}</style><defs><marker id="f3-ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L9 5L1 8.8z" class="f-mut"/></marker><pattern id="f3-hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="9" stroke="currentColor" stroke-width="2.4" class="s-line"/></pattern></defs><rect width="520" height="926" class="f-bg"/><g transform="translate(486 12) scale(0.75)" class="nf s-gatex" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6"/></g><text x="480" y="27" class="f-gatex tb" font-size="13.5" font-weight="600" text-anchor="end" data-x0="270" data-x1="482" data-y1="926"><tspan x="480" dy="0">człowiek decyduje</tspan></text><rect x="84" y="46" width="420" height="85" rx="14" class="f-surf s-line" stroke-width="1.5"/><text x="100" y="75" class="f-ink td" font-size="17" font-weight="700" text-anchor="start" data-x0="100" data-x1="414" data-y1="926"><tspan x="100" dy="0">Sygnał</tspan></text><text x="100" y="99" class="f-mut tb" font-size="14" font-weight="400" text-anchor="start" data-x0="100" data-x1="494" data-y1="926"><tspan x="100" dy="0">Co tydzień: nowe prace, modele i dane</tspan><tspan x="100" dy="19.0">publiczne. Powstaje lista kandydatów.</tspan></text><rect x="84" y="145" width="420" height="104" rx="14" class="f-surf s-line" stroke-width="1.5"/><text x="100" y="174" class="f-ink td" font-size="17" font-weight="700" text-anchor="start" data-x0="100" data-x1="414" data-y1="926"><tspan x="100" dy="0">Wybór</tspan></text><g transform="translate(470 157) scale(0.8333)" class="nf s-gatex" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6"/></g><text x="100" y="198" class="f-mut tb" font-size="14" font-weight="400" text-anchor="start" data-x0="100" data-x1="494" data-y1="926"><tspan x="100" dy="0">Pięć pytań odrzucających: po co, czy są dane,</tspan><tspan x="100" dy="19.0">czy to legalne, czy da się zmierzyć, czy nie</tspan><tspan x="100" dy="19.0">da się prościej bez AI.</tspan></text><rect x="84" y="263" width="420" height="104" rx="14" class="f-surf s-line" stroke-width="1.5"/><text x="100" y="292" class="f-ink td" font-size="17" font-weight="700" text-anchor="start" data-x0="100" data-x1="414" data-y1="926"><tspan x="100" dy="0">Karta hipotezy</tspan></text><g transform="translate(470 275) scale(0.8333)" class="nf s-gatex" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6"/></g><g transform="translate(440 274) scale(0.9167)" class="nf s-pubx" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="10" r="6.5"/><path d="M9.3 10l2 2 3.6-4"/><path d="M8.5 15.5L7 21l5-2.5 5 2.5-1.5-5.5"/></g><text x="100" y="316" class="f-mut tb" font-size="14" font-weight="400" text-anchor="start" data-x0="100" data-x1="494" data-y1="926"><tspan x="100" dy="0">Co sprawdzamy i co by nas obaliło.</tspan><tspan x="100" dy="19.0">Zamrożona i opublikowana przed pierwszym</tspan><tspan x="100" dy="19.0">pomiarem, żeby nikt nie dopasował metody.</tspan></text><rect x="84" y="381" width="420" height="104" rx="14" class="f-surf s-line" stroke-width="1.5"/><text x="100" y="410" class="f-ink td" font-size="17" font-weight="700" text-anchor="start" data-x0="100" data-x1="414" data-y1="926"><tspan x="100" dy="0">Szybki test</tspan></text><rect x="464" y="392" width="26" height="22" rx="11" class="f-pubt s-pub" stroke-width="1.2"/><text x="477" y="408" class="f-pubx tm" font-size="13" font-weight="700" text-anchor="middle" data-x0="464" data-x1="490" data-y1="926"><tspan x="477" dy="0">S</tspan></text><text x="100" y="434" class="f-mut tb" font-size="14" font-weight="400" text-anchor="start" data-x0="100" data-x1="494" data-y1="926"><tspan x="100" dy="0">Lokalne modele, mała próba, od kilku godzin</tspan><tspan x="100" dy="19.0">do dwóch dni. Część próby zostaje zamknięta</tspan><tspan x="100" dy="19.0">do samego końca.</tspan></text><rect x="84" y="499" width="420" height="104" rx="14" class="f-surf s-line" stroke-width="1.5"/><text x="100" y="528" class="f-ink td" font-size="17" font-weight="700" text-anchor="start" data-x0="100" data-x1="414" data-y1="926"><tspan x="100" dy="0">Bramka</tspan></text><g transform="translate(470 511) scale(0.8333)" class="nf s-gatex" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6"/></g><text x="100" y="552" class="f-mut tb" font-size="14" font-weight="400" text-anchor="start" data-x0="100" data-x1="494" data-y1="926"><tspan x="100" dy="0">Wynik kontra próg z karty. Idziemy dalej,</tspan><tspan x="100" dy="19.0">kończymy, zmieniamy hipotezę albo odkładamy.</tspan><tspan x="100" dy="19.0">Wynik negatywny też publikujemy.</tspan></text><rect x="84" y="617" width="420" height="104" rx="14" class="f-surf s-line" stroke-width="1.5"/><text x="100" y="646" class="f-ink td" font-size="17" font-weight="700" text-anchor="start" data-x0="100" data-x1="414" data-y1="926"><tspan x="100" dy="0">Pilot</tspan></text><g transform="translate(470 629) scale(0.8333)" class="nf s-gatex" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6"/></g><rect x="434" y="628" width="26" height="22" rx="11" class="f-pubt s-pub" stroke-width="1.2"/><text x="447" y="644" class="f-pubx tm" font-size="13" font-weight="700" text-anchor="middle" data-x0="434" data-x1="460" data-y1="926"><tspan x="447" dy="0">M</tspan></text><text x="100" y="670" class="f-mut tb" font-size="14" font-weight="400" text-anchor="start" data-x0="100" data-x1="494" data-y1="926"><tspan x="100" dy="0">Większa próba, ocena na ślepo przez ludzi,</tspan><tspan x="100" dy="19.0">spis typowych błędów, koszt i czas.</tspan><tspan x="100" dy="19.0">Na końcu druga bramka.</tspan></text><rect x="84" y="735" width="420" height="85" rx="14" class="f-surf s-line" stroke-width="1.5"/><text x="100" y="764" class="f-ink td" font-size="17" font-weight="700" text-anchor="start" data-x0="100" data-x1="414" data-y1="926"><tspan x="100" dy="0">Plan dla dużej organizacji</tspan></text><rect x="464" y="746" width="26" height="22" rx="11" class="f-pubt s-pub" stroke-width="1.2"/><text x="477" y="762" class="f-pubx tm" font-size="13" font-weight="700" text-anchor="middle" data-x0="464" data-x1="490" data-y1="926"><tspan x="477" dy="0">L</tspan></text><text x="100" y="788" class="f-mut tb" font-size="14" font-weight="400" text-anchor="start" data-x0="100" data-x1="494" data-y1="926"><tspan x="100" dy="0">Tylko dokument, bez wdrożenia. Liczby w nim</tspan><tspan x="100" dy="19.0">pochodzą z pomiarów pilota.</tspan></text><line x1="44" y1="76" x2="44" y2="765" class="s-line" stroke-width="3"/><circle cx="44" cy="76" r="17" class="f-priv"/><text x="44" y="81.5" class="f-on tm" font-size="15.5" font-weight="700" text-anchor="middle" data-x0="28" data-x1="60" data-y1="926"><tspan x="44" dy="0">1</tspan></text><line x1="61" y1="76" x2="84" y2="76" class="s-line" stroke-width="2"/><circle cx="44" cy="175" r="17" class="f-priv"/><text x="44" y="180.5" class="f-on tm" font-size="15.5" font-weight="700" text-anchor="middle" data-x0="28" data-x1="60" data-y1="926"><tspan x="44" dy="0">2</tspan></text><line x1="61" y1="175" x2="84" y2="175" class="s-line" stroke-width="2"/><circle cx="44" cy="293" r="17" class="f-priv"/><text x="44" y="298.5" class="f-on tm" font-size="15.5" font-weight="700" text-anchor="middle" data-x0="28" data-x1="60" data-y1="926"><tspan x="44" dy="0">3</tspan></text><line x1="61" y1="293" x2="84" y2="293" class="s-line" stroke-width="2"/><circle cx="44" cy="411" r="17" class="f-priv"/><text x="44" y="416.5" class="f-on tm" font-size="15.5" font-weight="700" text-anchor="middle" data-x0="28" data-x1="60" data-y1="926"><tspan x="44" dy="0">4</tspan></text><line x1="61" y1="411" x2="84" y2="411" class="s-line" stroke-width="2"/><circle cx="44" cy="529" r="17" class="f-priv"/><text x="44" y="534.5" class="f-on tm" font-size="15.5" font-weight="700" text-anchor="middle" data-x0="28" data-x1="60" data-y1="926"><tspan x="44" dy="0">5</tspan></text><line x1="61" y1="529" x2="84" y2="529" class="s-line" stroke-width="2"/><circle cx="44" cy="647" r="17" class="f-priv"/><text x="44" y="652.5" class="f-on tm" font-size="15.5" font-weight="700" text-anchor="middle" data-x0="28" data-x1="60" data-y1="926"><tspan x="44" dy="0">6</tspan></text><line x1="61" y1="647" x2="84" y2="647" class="s-line" stroke-width="2"/><circle cx="44" cy="765" r="17" class="f-priv"/><text x="44" y="770.5" class="f-on tm" font-size="15.5" font-weight="700" text-anchor="middle" data-x0="28" data-x1="60" data-y1="926"><tspan x="44" dy="0">7</tspan></text><line x1="61" y1="765" x2="84" y2="765" class="s-line" stroke-width="2"/><rect x="16" y="844" width="488" height="66" rx="14" class="f-pubt s-pub" stroke-width="1.5"/><text x="32" y="872" class="f-pubx tb" font-size="14.5" font-weight="500" text-anchor="start" data-x0="32" data-x1="490" data-y1="926"><tspan x="32" dy="0">Każdy krok zostawia plik w repozytorium. Z tych plików</tspan><tspan x="32" dy="19.7">powstają strony wynikowe i karta projektu.</tspan></text></svg>