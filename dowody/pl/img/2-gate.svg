.ig .f-ok{fill:var(--ok)}.ig .f-okt{fill:var(--ok-t)}.ig .f-okx{fill:var(--ok-x)}.ig .s-ok{stroke:var(--ok)}.ig .s-okx{stroke:var(--ok-x)}</style><defs><marker id="f2-ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L9 5L1 8.8z" class="f-mut"/></marker><pattern id="f2-hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="9" stroke="currentColor" stroke-width="2.4" class="s-line"/></pattern></defs><rect width="520" height="748" class="f-bg"/><rect x="16" y="16" width="488" height="66" rx="14" class="f-surf s-line" stroke-width="1.5"/><circle cx="52" cy="49" r="20" class="f-pub"/><g transform="translate(41.0 38.0) scale(0.9167)" class="nf s-on" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></g><text x="84" y="45" class="f-ink td" font-size="19" font-weight="700" text-anchor="start" data-x0="84" data-x1="500" data-y1="748"><tspan x="84" dy="0">Nowy dokument</tspan></text><text x="84" y="66" class="f-mut tb" font-size="14" font-weight="400" text-anchor="start" data-x0="84" data-x1="500" data-y1="748"><tspan x="84" dy="0">po polsku i po angielsku</tspan></text><line x1="260.0" y1="82" x2="260.0" y2="106" class="s-mut" stroke-width="2" stroke-linecap="round" marker-end="url(#f2-ar)"/><rect x="16" y="110" width="488" height="62" rx="14" class="f-surf s-line" stroke-width="1.5"/><circle cx="50" cy="141" r="18" class="f-priv"/><g transform="translate(40.1 131.1) scale(0.825)" class="nf s-on" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6z"/><path d="M9 12l2.2 2.2L15.5 10"/></g><text x="80" y="137" class="f-ink tb" font-size="16" font-weight="700" text-anchor="start" data-x0="80" data-x1="504" data-y1="748"><tspan x="80" dy="0">Zakazane nazwy i dane osobowe</tspan></text><text x="80" y="157" class="f-mut tb" font-size="14" font-weight="400" text-anchor="start" data-x0="80" data-x1="504" data-y1="748"><tspan x="80" dy="0">Skaner zagląda też w ukryte dane plików.</tspan></text><rect x="16" y="182" width="488" height="62" rx="14" class="f-surf s-line" stroke-width="1.5"/><circle cx="50" cy="213" r="18" class="f-priv"/><g transform="translate(40.1 203.1) scale(0.825)" class="nf s-on" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5.5 5.5"/></g><text x="80" y="209" class="f-ink tb" font-size="16" font-weight="700" text-anchor="start" data-x0="80" data-x1="504" data-y1="748"><tspan x="80" dy="0">Podobieństwo do prywatnych notatek</tspan></text><text x="80" y="229" class="f-mut tb" font-size="14" font-weight="400" text-anchor="start" data-x0="80" data-x1="504" data-y1="748"><tspan x="80" dy="0">Odpowiedź brzmi tylko: podobne albo nie.</tspan></text><rect x="16" y="254" width="488" height="62" rx="14" class="f-surf s-line" stroke-width="1.5"/><circle cx="50" cy="285" r="18" class="f-priv"/><g transform="translate(40.1 275.1) scale(0.825)" class="nf s-on" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h8l3 3v11H4z"/><path d="M12 5v3h3"/><path d="M9 3h8l3 3v11"/></g><text x="80" y="281" class="f-ink tb" font-size="16" font-weight="700" text-anchor="start" data-x0="80" data-x1="504" data-y1="748"><tspan x="80" dy="0">Wersje PL i EN się zgadzają</tspan></text><text x="80" y="301" class="f-mut tb" font-size="14" font-weight="400" text-anchor="start" data-x0="80" data-x1="504" data-y1="748"><tspan x="80" dy="0">Te same liczby, nagłówki, linki i tabele.</tspan></text><rect x="16" y="326" width="488" height="62" rx="14" class="f-surf s-line" stroke-width="1.5"/><circle cx="50" cy="357" r="18" class="f-priv"/><g transform="translate(40.1 347.1) scale(0.825)" class="nf s-on" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></g><text x="80" y="353" class="f-ink tb" font-size="16" font-weight="700" text-anchor="start" data-x0="80" data-x1="504" data-y1="748"><tspan x="80" dy="0">Poprawna budowa pliku</tspan></text><text x="80" y="373" class="f-mut tb" font-size="14" font-weight="400" text-anchor="start" data-x0="80" data-x1="504" data-y1="748"><tspan x="80" dy="0">Nagłówek zgodny ze schematem.</tspan></text><rect x="16" y="398" width="488" height="62" rx="14" class="f-surf s-line" stroke-width="1.5"/><circle cx="50" cy="429" r="18" class="f-priv"/><g transform="translate(40.1 419.1) scale(0.825)" class="nf s-on" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6"/></g><text x="80" y="425" class="f-ink tb" font-size="16" font-weight="700" text-anchor="start" data-x0="80" data-x1="504" data-y1="748"><tspan x="80" dy="0">Tekst pisany po ludzku</tspan></text><text x="80" y="445" class="f-mut tb" font-size="14" font-weight="400" text-anchor="start" data-x0="80" data-x1="504" data-y1="748"><tspan x="80" dy="0">Bez nawyków typowych dla modeli AI.</tspan></text><path d="M260.0 466 V486 H134 V503" class="nf s-mut" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f2-ar)"/><path d="M260.0 486 H386 V503" class="nf s-mut" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f2-ar)"/><rect x="16" y="508" width="236" height="116" rx="14" class="f-okt s-ok" stroke-width="1.5"/><circle cx="44" cy="538" r="15" class="f-ok"/><g transform="translate(35.75 529.75) scale(0.6875)" class="nf s-on" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text x="68" y="544" class="f-okx td" font-size="16" font-weight="700" text-anchor="start" data-x0="68" data-x1="244" data-y1="748"><tspan x="68" dy="0">Wszystko przeszło</tspan></text><text x="30" y="578" class="f-ink tb" font-size="14" 