<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="Project documentation and experiments pass different checks. A unit that passes goes to the public repository as a whole and then to the lab site. A unit that fails is skipped as a whole, waits in quarantine and is decided on the review desk, then goes through the gate again." font-family="system-ui, -apple-system, Segoe UI, sans-serif"><title>From a file to publication or quarantine</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="960" height="440" rx="14" fill="#ffffff"/><text x="20" y="34" font-size="15" font-weight="700" fill="#1f2937">From a file to publication or quarantine</text><text x="20" y="66" font-size="12" fill="#6b7280">Vault (source)</text><text x="260" y="66" font-size="12" fill="#6b7280">Gate</text><rect x="20" y="80" width="190" height="84" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><text x="115.0" y="118.0" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700">Project documentation</text><text x="115.0" y="135.0" text-anchor="middle" font-size="13"  fill="#6b7280">roadmaps, plans, texts</text><rect x="20" y="220" width="190" height="110" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><text x="115.0" y="262.5" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700">Experiment</text><text x="115.0" y="279.5" text-anchor="middle" font-size="13"  fill="#6b7280">card, dossier pl+en,</text><text x="115.0" y="296.5" text-anchor="middle" font-size="13"  fill="#6b7280">data, registry lines</text><rect x="260" y="80" width="220" height="84" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><text x="370.0" y="118.0" text-anchor="middle" font-size="13"  fill="#6b7280">Literal scanner, parity,</text><text x="370.0" y="135.0" text-anchor="middle" font-size="13"  fill="#6b7280">schemas, language</text><rect x="260" y="220" width="220" height="110" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><text x="370.0" y="271.0" text-anchor="middle" font-size="13"  fill="#6b7280">All checks, including</text><text x="370.0" y="288.0" text-anchor="middle" font-size="13"  fill="#6b7280">semantic comparison</text><polyline points="210,122 260,122" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="210,275 260,275" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ah)"/><rect x="540" y="160" width="140" height="90" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><text x="610.0" y="201.0" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700">Unit</text><text x="610.0" y="218.0" text-anchor="middle" font-size="13"  fill="#6b7280">passes?</text><polyline points="480,122 510,122 510,190 540,190" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="480,275 510,275 510,222 540,222" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ah)"/><rect x="740" y="60" width="200" height="70" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/><text x="840.0" y="91.0" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700">Public repository</text><text x="840.0" y="108.0" text-anchor="middle" font-size="13"  fill="#6b7280">the whole unit at once</text><rect x="740" y="160" width="200" height="60" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="840.0" y="186.0" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700">lab.exocortex.zone</text><text x="840.0" y="203.0" text-anchor="middle" font-size="13"  fill="#6b7280">rebuilt every hour</text><polyline points="680,190 710,190 710,95 740,95" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#ah)"/><text x="716" y="146" font-size="12" font-weight="700" fill="#15803d">yes</text><polyline points="840,130 840,160" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#ah)"/><rect x="520" y="310" width="180" height="84" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="610.0" y="339.5" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700">Quarantine</text><text x="610.0" y="356.5" text-anchor="middle" font-size="13"  fill="#6b7280">whole unit skipped,</text><text x="610.0" y="373.5" text-anchor="middle" font-size="13"  fill="#6b7280">public version stays</text><polyline points="610,250 610,310" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#ah)"/><text x="620" y="284" font-size="12" font-weight="700" fill="#b45309">no</text><rect x="740" y="310" width="200" height="84" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="840.0" y="348.0" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700">Review desk</text><text x="840.0" y="365.0" text-anchor="middle" font-size="13"  fill="#6b7280">keep or to edit</text><polyline points="700,352 740,352" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="840,394 840,420 370,420 370,330" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#ah)"/><text x="380" y="414" font-size="12" fill="#6b7280">next run within 15 minutes</text></svg>
