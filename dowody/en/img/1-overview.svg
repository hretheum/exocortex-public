<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 632" class="ig" role="img" aria-label="Diagram: the lab reads only public sources, results pass through the publishing gate into the public repository, and private and client data sit behind a wall, outside the lab." width="520" height="632" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Diagram: the lab reads only public sources, results pass through the publishing gate into the public repository, and private and client data sit behind a wall, outside the lab.</title><style>.ig{--bg:#F3F5F8;--surface:#FFFFFF;--ink:#172033;--muted:#566079;--line:#CBD3E0;--priv:#3B4A78;--priv-t:#E3E8F6;--priv-x:#2F3D68;--pub:#0B8A78;--pub-t:#DAF2EE;--pub-x:#06695B;--gate:#C77700;--gate-t:#FCEFD2;--gate-x:#8A5200;--ok:#2B8A4B;--ok-t:#DDF2E4;--ok-x:#1E6B38;--on:#FFFFFF}
@media (prefers-color-scheme: dark){.ig{--bg:#0E1320;--surface:#161D2E;--ink:#E9EDF6;--muted:#A4AEC6;--line:#2E3852;--priv:#93A6E8;--priv-t:#1E2746;--priv-x:#B3C0F0;--pub:#3CC7B1;--pub-t:#12393A;--pub-x:#5ED8C4;--gate:#F0B429;--gate-t:#3A2F10;--gate-x:#F5C65A;--ok:#55C17C;--ok-t:#163A25;--ok-x:#7BD69A;--on:#0E1320}}
.ig .f-bg{fill:var(--bg)}.ig .f-surf{fill:var(--surface)}.ig .f-ink{fill:var(--ink)}
.ig .f-mut{fill:var(--muted)}.ig .f-on{fill:var(--on)}.ig .f-line{fill:var(--line)}
.ig .s-line{stroke:var(--line)}.ig .s-mut{stroke:var(--muted)}.ig .s-ink{stroke:var(--ink)}.ig .s-on{stroke:var(--on)}
.ig .nf{fill:none}
.ig .tb{font-family:var(--font-body,'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif)}
.ig .td{font-family:var(--font-display,'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif)}
.ig .tm{font-family:var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)}
.ig .f-priv{fill:var(--priv)}.ig .f-privt{fill:var(--priv-t)}.ig .f-privx{fill:var(--priv-x)}.ig .s-priv{stroke:var(--priv)}.ig .s-privx{stroke:var(--priv-x)}
.ig .f-pub{fill:var(--pub)}.ig .f-pubt{fill:var(--pub-t)}.ig .f-pubx{fill:var(--pub-x)}.ig .s-pub{stroke:var(--pub)}.ig .s-pubx{stroke:var(--pub-x)}
.ig .f-gate{fill:var(--gate)}.ig .f-gatet{fill:var(--gate-t)}.ig .f-gatex{fill:var(--gate-x)}.ig .s-gate{stroke:var(--gate)}.ig .s-gatex{stroke:var(--gate-x)}
.ig .f-ok{fill:var(--ok)}.ig .f-okt{fill:var(--ok-t)}.ig .f-okx{fill:var(--ok-x)}.ig .s-ok{stroke:var(--ok)}.ig .s-okx{stroke:var(--ok-x)}</style><defs><marker id="f1-ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L9 5L1 8.8z" class="f-mut"/></marker><pattern id="f1-hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="9" stroke="currentColor" stroke-width="2.4" class="s-line"/></pattern></defs><rect width="520" height="632" class="f-bg"/><rect x="16" y="16" width="488" height="92" rx="14" class="f-surf s-line" stroke-width="1.5"/><circle cx="56" cy="62" r="22" class="f-priv"/><g transform="translate(43.9 49.9) scale(1.0083)" class="nf s-on" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3.2 3.2 3.2 14.8 0 18M12 3c-3.2 3.2-3.2 14.8 0 18"/></g><text x="94" y="58" class="f-ink td" font-size="20" font-weight="700" text-anchor="start" data-x0="94" data-x1="500" data-y1="632"><tspan x="94" dy="0">Public sources</tspan></text><text x="94" y="82" class="f-mut tb" font-size="14.5" font-weight="400" text-anchor="start" data-x0="94" data-x1="500" data-y1="632"><tspan x="94" dy="0">Papers, open data</tspan><tspan x="94" dy="19.7">and our own texts.</tspan></text><line x1="96" y1="108" x2="96" y2="154" class="s-mut" stroke-width="2" stroke-linecap="round" marker-end="url(#f1-ar)"/><text x="114" y="136" class="f-mut tb" font-size="13.5" font-weight="500" text-anchor="start" data-x0="114" data-x1="504" data-y1="632"><tspan x="114" dy="0">Only from the allowlist</tspan></text><rect x="16" y="158" width="488" height="112" rx="14" class="f-pubt s-pub" stroke-width="1.5"/><circle cx="56" cy="214" r="22" class="f-pub"/><g transform="translate(43.9 201.9) scale(1.0083)" class="nf s-on" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3"/><path d="M7.5 15h9"/></g><text x="94" y="208" class="f-pubx td" font-size="21" font-weight="700" text-anchor="start" data-x0="94" data-x1="500" data-y1="632"><tspan x="94" dy="0">The lab</tspan></text><text x="94" y="233" class="f-ink tb" font-size="14.5" font-weight="400" text-anchor="start" data-x0="94" data-x1="500" data-y1="632"><tspan x="94" dy="0">Tests ideas about AI.</tspan><tspan x="94" dy="19.7">Every step is recorded in the open.</tspan></text><line x1="96" y1="270" x2="96" y2="372" class="s-mut" stroke-width="2" stroke-linecap="round" marker-end="url(#f1-ar)"/><rect x="114" y="282" width="186" height="32" rx="16.0" class="f-gatet s-gate" stroke-width="1.2"/><g transform="translate(124 290.0) scale(0.6667)" class="nf s-gatex" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6z"/><path d="M9 12l2.2 2.2L15.5 10"/></g><text x="146" y="302.59" class="f-gatex tb" font-size="13.5" font-weight="600" text-anchor="start" data-x0="146" data-x1="294" data-y1="632"><tspan x="146" dy="0">Publishing gate</tspan></text><text x="114" y="338" class="f-mut tb" font-size="13.5" font-weight="500" text-anchor="start" data-x0="114" data-x1="504" data-y1="632"><tspan x="114" dy="0">Every 15 minutes, after every</tspan><tspan x="114" dy="17.6">file has been checked</tspan></text><rect x="16" y="376" width="488" height="92" rx="14" class="f-surf s-line" stroke-width="1.5"/><circle cx="56" cy="422" r="22" class="f-pub"/><g transform="translate(43.9 409.9) scale(1.0083)" class="nf s-on" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3.2 3.2 3.2 14.8 0 18M12 3c-3.2 3.2-3.2 14.8 0 18"/></g><text x="94" y="416" class="f-ink td" font-size="20" font-weight="700" text-anchor="start" data-x0="94" data-x1="500" data-y1="632"><tspan x="94" dy="0">Public repository</tspan></text><text x="94" y="440" class="f-mut tb" font-size="14.5" font-weight="400" text-anchor="start" data-x0="94" data-x1="500" data-y1="632"><tspan x="94" dy="0">Hypotheses, results, plan.</tspan><tspan x="94" dy="19.7">Anyone can look.</tspan></text><rect x="16" y="490" width="488" height="22" rx="6" class="f-surf s-line" stroke-width="1.2"/><rect x="16" y="490" width="488" height="22" rx="6" fill="url(#f1-hatch)" class="s-line"/><rect x="16" y="524" width="488" height="96" rx="14" class="f-privt s-priv" stroke-width="1.5"/><circle cx="56" cy="572" r="20" class="f-priv"/><g transform="translate(45.0 561.0) scale(0.9167)" class="nf s-on" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></g><text x="94" y="567" class="f-privx td" font-size="18" font-weight="700" text-anchor="start" data-x0="94" data-x1="500" data-y1="632"><tspan x="94" dy="0">Outside the lab</tspan></text><text x="94" y="589" class="f-ink tb" font-size="14" font-weight="400" text-anchor="start" data-x0="94" data-x1="500" data-y1="632"><tspan x="94" dy="0">Private and client data.</tspan><tspan x="94" dy="19.0">A separate world, no link.</tspan></text></svg>