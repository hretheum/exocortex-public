<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 664" class="ig" role="img" aria-label="Diagram: two separate worlds, private and the lab. Only sources from the allowlist enter the lab, and a nightly test checks the isolation." width="520" height="664" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Diagram: two separate worlds, private and the lab. Only sources from the allowlist enter the lab, and a nightly test checks the isolation.</title><style>.ig{--bg:#F3F5F8;--surface:#FFFFFF;--ink:#172033;--muted:#566079;--line:#CBD3E0;--priv:#3B4A78;--priv-t:#E3E8F6;--priv-x:#2F3D68;--pub:#0B8A78;--pub-t:#DAF2EE;--pub-x:#06695B;--gate:#C77700;--gate-t:#FCEFD2;--gate-x:#8A5200;--ok:#2B8A4B;--ok-t:#DDF2E4;--ok-x:#1E6B38;--on:#FFFFFF}
@media (prefers-color-scheme: dark){.ig{--bg:#0E1320;--surface:#161D2E;--ink:#E9EDF6;--muted:#A4AEC6;--line:#2E3852;--priv:#93A6E8;--priv-t:#1E2746;--priv-x:#B3C0F0;--pub:#3CC7B1;--pub-t:#12393A;--pub-x:#5ED8C4;--gate:#F0B429;--gate-t:#3A2F10;--gate-x:#F5C65A;--ok:#55C17C;--ok-t:#163A25;--ok-x:#7BD69A;--on:#0E1320}}
.ig .f-bg{fill:var(--bg)}.ig .f-surf{fill:var(--surface)}.ig .f-ink{fill:var(--ink)}
.ig .f-mut{fill:var(--muted)}.ig .f-on{fill:var(--on)}.ig .f-line{fill:var(--line)}
.ig .s-line{stroke:var(--line)}.ig .s-mut{stroke:var(--muted)}.ig .s-ink{stroke:var(--ink)}.ig .s-on{stroke:var(--on)}
.ig .nf{fill:none}
.ig .tb{font-family:var(--font-body,'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif)}
.ig .td{font-family:var(--font-display,'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif)}
.ig .tm{font-family:var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)}
.ig .f-priv{fill:var(--priv)}.ig .f-privt{fill:var(--priv-t)}.ig .f-privx{fill:var(--priv-x)}.ig .s-priv{stroke:var(--priv)}.ig .s-privx{stroke:var(--priv-x)}
.ig .f-pub{fill:var(--pub)}.ig .f-pubt{fill:var(--pub-t)}.ig .f-pubx{fill:var(--pub-x)}.ig .s-pub{stroke:var(--pub)}.ig .s-pubx{stroke:var(--pub-x)}
.ig .f-gate{fill:var(--gate)}.ig .f-gatet{fill:var(--gate-t)}.ig .f-gatex{fill:var(--gate-x)}.ig .s-gate{stroke:var(--gate)}.ig .s-gatex{stroke:var(--gate-x)}
.ig .f-ok{fill:var(--ok)}.ig .f-okt{fill:var(--ok-t)}.ig .f-okx{fill:var(--ok-x)}.ig .s-ok{stroke:var(--ok)}.ig .s-okx{stroke:var(--ok-x)}</style><defs><marker id="f6-ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L9 5L1 8.8z" class="f-mut"/></marker><pattern id="f6-hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="9" stroke="currentColor" stroke-width="2.4" class="s-line"/></pattern></defs><rect width="520" height="664" class="f-bg"/><rect x="16" y="16" width="488" height="338" rx="18" class="f-surf s-line" stroke-width="1.5" stroke-dasharray="7 6"/><g transform="translate(32 30) scale(0.8333)" class="nf s-mut" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="7" rx="2"/><rect x="4" y="13" width="16" height="7" rx="2"/><path d="M8 7.5h.01M8 16.5h.01"/></g><text x="58" y="46" class="f-mut tm" font-size="14" font-weight="600" text-anchor="start" data-x0="58" data-x1="300" data-y1="664"><tspan x="58" dy="0">Two separate worlds</tspan></text><rect x="32" y="68" width="168" height="178" rx="14" class="f-privt s-priv" stroke-width="1.5"/><circle cx="64" cy="106" r="19" class="f-priv"/><g transform="translate(53.55 95.55) scale(0.8708)" class="nf s-on" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></g><text x="44" y="154" class="f-privx td" font-size="17" font-weight="700" text-anchor="start" data-x0="44" data-x1="196" data-y1="664"><tspan x="44" dy="0">The private</tspan><tspan x="44" dy="19.5">world</tspan></text><text x="44" y="204" class="f-ink tb" font-size="14" font-weight="400" text-anchor="start" data-x0="44" data-x1="196" data-y1="664"><tspan x="44" dy="0">Private and client</tspan><tspan x="44" dy="19.0">data.</tspan></text><text x="32" y="276" class="f-mut tb" font-size="13.5" font-weight="500" text-anchor="start" data-x0="32" data-x1="206" data-y1="664"><tspan x="32" dy="0">There is no road</tspan><tspan x="32" dy="18.1">between them, even</tspan><tspan x="32" dy="18.1">after a slip in</tspan><tspan x="32" dy="18.1">the settings.</tspan></text><rect x="208" y="68" width="28" height="258" rx="6" class="f-surf s-line" stroke-width="1.2"/><rect x="208" y="68" width="28" height="258" rx="6" fill="url(#f6-hatch)" class="s-line"/><circle cx="222" cy="197" r="14" class="f-gate"/><g transform="translate(215 190) scale(0.5833)" class="nf s-on" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></g><rect x="244" y="68" width="244" height="258" rx="14" class="f-pubt s-pub" stroke-width="1.5"/><circle cx="278" cy="106" r="19" class="f-pub"/><g transform="translate(267.55 95.55) scale(0.8708)" class="nf s-on" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3"/><path d="M7.5 15h9"/></g><text x="304" y="112" class="f-pubx td" font-size="17" font-weight="700" text-anchor="start" data-x0="304" data-x1="482" data-y1="664"><tspan x="304" dy="0">The lab</tspan></text><rect x="254" y="150" width="226" height="36" rx="18.0" class="f-pubt s-pub" stroke-width="1.2"/><g transform="translate(264 160.0) scale(0.6667)" class="nf s-pubx" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></g><text x="286" y="172.42" class="f-pubx tb" font-size="13" font-weight="600" text-anchor="start" data-x0="286" data-x1="474" data-y1="664"><tspan x="286" dy="0">Its own database</tspan></text><rect x="254" y="200" width="226" height="36" rx="18.0" class="f-pubt s-pub" stroke-width="1.2"/><g transform="translate(264 210.0) scale(0.6667)" class="nf s-pubx" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v6M12 15v6M3 12h6M15 12h6"/></g><text x="286" y="222.42" class="f-pubx tb" font-size="13" font-weight="600" text-anchor="start" data-x0="286" data-x1="474" data-y1="664"><tspan x="286" dy="0">Its own closed network</tspan></text><rect x="254" y="250" width="226" height="36" rx="18.0" class="f-pubt s-pub" stroke-width="1.2"/><g transform="translate(264 260.0) scale(0.6667)" class="nf s-pubx" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></g><text x="286" y="272.42" class="f-pubx tb" font-size="13" font-weight="600" text-anchor="start" data-x0="286" data-x1="474" data-y1="664"><tspan x="286" dy="0">Documents, read-only</tspan></text><line x1="366" y1="392" x2="366" y2="330" class="s-mut" stroke-width="2" stroke-linecap="round" marker-end="url(#f6-ar)"/><rect x="16" y="392" width="488" height="152" rx="14" class="f-surf s-line" stroke-width="1.5"/><text x="32" y="420" class="f-ink td" font-size="17" font-weight="700" text-anchor="start" data-x0="32" data-x1="504" data-y1="664"><tspan x="32" dy="0">Allowlist of sources</tspan></text><text x="32" y="441" class="f-mut tb" font-size="13.5" font-weight="400" text-anchor="start" data-x0="32" data-x1="504" data-y1="664"><tspan x="32" dy="0">A new source is an entry with a reason and a legal basis.</tspan></text><rect x="32" y="456" width="198" height="30" rx="15.0" class="f-okt s-ok" stroke-width="1.2"/><g transform="translate(42 463.0) scale(0.6667)" class="nf s-okx" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text x="64" y="475.42" class="f-okx tb" font-size="13" font-weight="600" text-anchor="start" data-x0="64" data-x1="224" data-y1="664"><tspan x="64" dy="0">Our own documents</tspan></text><rect x="240" y="456" width="234" height="30" rx="15.0" class="f-okt s-ok" stroke-width="1.2"/><g transform="translate(250 463.0) scale(0.6667)" class="nf s-okx" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text x="272" y="475.42" class="f-okx tb" font-size="13" font-weight="600" text-anchor="start" data-x0="272" data-x1="468" data-y1="664"><tspan x="272" dy="0">arXiv abstracts (CC0)</tspan></text><rect x="32" y="496" width="92" height="30" rx="15.0" class="f-gatet s-gate" stroke-width="1.2"/><g transform="translate(42 503.0) scale(0.6667)" class="nf s-gatex" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></g><text x="64" y="515.42" class="f-gatex tb" font-size="13" font-weight="600" text-anchor="start" data-x0="64" data-x1="118" data-y1="664"><tspan x="64" dy="0">Email</tspan></text><rect x="134" y="496" width="154" height="30" rx="15.0" class="f-gatet s-gate" stroke-width="1.2"/><g transform="translate(144 503.0) scale(0.6667)" class="nf s-gatex" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></g><text x="166" y="515.42" class="f-gatex tb" font-size="13" font-weight="600" text-anchor="start" data-x0="166" data-x1="282" data-y1="664"><tspan x="166" dy="0">Client notes</tspan></text><rect x="16" y="560" width="488" height="88" rx="14" class="f-surf s-line" stroke-width="1.5"/><g transform="translate(30 578) scale(0.9167)" class="nf s-priv" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11V9a3 3 0 0 1 3-3h11M15 3l3 3-3 3M20 13v2a3 3 0 0 1-3 3H6M9 21l-3-3 3-3"/></g><text x="64" y="588" class="f-ink tb" font-size="15.5" font-weight="700" text-anchor="start" data-x0="64" data-x1="504" data-y1="664"><tspan x="64" dy="0">Every night: an isolation test</tspan></text><text x="64" y="608" class="f-mut tb" font-size="13.5" font-weight="400" text-anchor="start" data-x0="64" data-x1="504" data-y1="664"><tspan x="64" dy="0">From inside the lab we try to reach the private</tspan><tspan x="64" dy="17.8">database at every known address. Every attempt must</tspan><tspan x="64" dy="17.8">fail, and no private folder may be visible.</tspan></text></svg>