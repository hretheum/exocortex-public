<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 800" class="ig" role="img" aria-label="Diagram: the architecture in five layers. Public sources enter the lab, which has four modules, through the allowlist, and results pass through the publishing gate into the public repository." width="520" height="800" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Diagram: the architecture in five layers. Public sources enter the lab, which has four modules, through the allowlist, and results pass through the publishing gate into the public repository.</title><style>.ig{--bg:#F3F5F8;--surface:#FFFFFF;--ink:#172033;--muted:#566079;--line:#CBD3E0;--priv:#3B4A78;--priv-t:#E3E8F6;--priv-x:#2F3D68;--pub:#0B8A78;--pub-t:#DAF2EE;--pub-x:#06695B;--gate:#C77700;--gate-t:#FCEFD2;--gate-x:#8A5200;--ok:#2B8A4B;--ok-t:#DDF2E4;--ok-x:#1E6B38;--on:#FFFFFF}
@media (prefers-color-scheme: dark){.ig{--bg:#0E1320;--surface:#161D2E;--ink:#E9EDF6;--muted:#A4AEC6;--line:#2E3852;--priv:#93A6E8;--priv-t:#1E2746;--priv-x:#B3C0F0;--pub:#3CC7B1;--pub-t:#12393A;--pub-x:#5ED8C4;--gate:#F0B429;--gate-t:#3A2F10;--gate-x:#F5C65A;--ok:#55C17C;--ok-t:#163A25;--ok-x:#7BD69A;--on:#0E1320}}
.ig .f-bg{fill:var(--bg)}.ig .f-surf{fill:var(--surface)}.ig .f-ink{fill:var(--ink)}
.ig .f-mut{fill:var(--muted)}.ig .f-on{fill:var(--on)}.ig .f-line{fill:var(--line)}
.ig .s-line{stroke:var(--line)}.ig .s-mut{stroke:var(--muted)}.ig .s-ink{stroke:var(--ink)}.ig .s-on{stroke:var(--on)}
.ig .nf{fill:none}
.ig .tb{font-family:var(--font-body,'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif)}
.ig .td{font-family:var(--font-display,'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif)}
.ig .tm{font-family:var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)}
.ig .f-priv{fill:var(--priv)}.ig .f-privt{fill:var(--priv-t)}.ig .f-privx{fill:var(--priv-x)}.ig .s-priv{stroke:var(--priv)}.ig .s-privx{stroke:var(--priv-x)}
.ig .f-pub{fill:var(--pub)}.ig .f-pubt{fill:var(--pub-t)}.ig .f-pubx{fill:var(--pub-x)}.ig .s-pub{stroke:var(--pub)}.ig .s-pubx{stroke:var(--pub-x)}
.ig .f-gate{fill:var(--gate)}.ig .f-gatet{fill:var(--gate-t)}.ig .f-gatex{fill:var(--gate-x)}.ig .s-gate{stroke:var(--gate)}.ig .s-gatex{stroke:var(--gate-x)}
.ig .f-ok{fill:var(--ok)}.ig .f-okt{fill:var(--ok-t)}.ig .f-okx{fill:var(--ok-x)}.ig .s-ok{stroke:var(--ok)}.ig .s-okx{stroke:var(--ok-x)}</style><defs><marker id="f5-ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.2L9 5L1 8.8z" class="f-mut"/></marker><pattern id="f5-hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="9" stroke="currentColor" stroke-width="2.4" class="s-line"/></pattern></defs><rect width="520" height="800" class="f-bg"/><rect x="16" y="16" width="488" height="76" rx="14" class="f-surf s-line" stroke-width="1.5"/><circle cx="52" cy="54" r="18" class="f-priv"/><g transform="translate(42.1 44.1) scale(0.825)" class="nf s-on" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3.2 3.2 3.2 14.8 0 18M12 3c-3.2 3.2-3.2 14.8 0 18"/></g><text x="82" y="50" class="f-ink td" font-size="18" font-weight="700" text-anchor="start" data-x0="82" data-x1="500" data-y1="800"><tspan x="82" dy="0">Public sources</tspan></text><text x="82" y="72" class="f-mut tb" font-size="13.5" font-weight="400" text-anchor="start" data-x0="82" data-x1="500" data-y1="800"><tspan x="82" dy="0">Papers, open data, our own documents.</tspan></text><line x1="96" y1="92" x2="96" y2="154" class="s-mut" stroke-width="2" stroke-linecap="round" marker-end="url(#f5-ar)"/><rect x="114" y="107" width="225" height="30" rx="15.0" class="f-gatet s-gate" stroke-width="1.2"/><g transform="translate(124 114.0) scale(0.6667)" class="nf s-gatex" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6z"/><path d="M9 12l2.2 2.2L15.5 10"/></g><text x="146" y="126.42" class="f-gatex tb" font-size="13" font-weight="600" text-anchor="start" data-x0="146" data-x1="333" data-y1="800"><tspan x="146" dy="0">Allowlist of sources</tspan></text><rect x="16" y="158" width="488" height="250" rx="14" class="f-pubt s-pub" stroke-width="1.5"/><circle cx="46" cy="186" r="15" class="f-pub"/><g transform="translate(37.75 177.75) scale(0.6875)" class="nf s-on" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3"/><path d="M7.5 15h9"/></g><text x="70" y="192" class="f-pubx td" font-size="19" font-weight="700" text-anchor="start" data-x0="70" data-x1="500" data-y1="800"><tspan x="70" dy="0">The lab</tspan></text><rect x="28" y="214" width="226" height="84" rx="14" class="f-surf s-line" stroke-width="1.5"/><circle cx="54" cy="240" r="14" class="f-pub"/><g transform="translate(46.3 232.3) scale(0.6417)" class="nf s-on" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v6M12 15v6M3 12h6M15 12h6"/></g><text x="78" y="245" class="f-ink td" font-size="15" font-weight="700" text-anchor="start" data-x0="78" data-x1="248" data-y1="800"><tspan x="78" dy="0">Knowledge graph</tspan></text><text x="44" y="270" class="f-mut tb" font-size="12.5" font-weight="400" text-anchor="start" data-x0="44" data-x1="248" data-y1="800"><tspan x="44" dy="0">Claims and connections</tspan><tspan x="44" dy="16.2">extracted from texts</tspan></text><rect x="266" y="214" width="226" height="84" rx="14" class="f-surf s-line" stroke-width="1.5"/><circle cx="292" cy="240" r="14" class="f-pub"/><g transform="translate(284.3 232.3) scale(0.6417)" class="nf s-on" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="7" rx="2"/><rect x="4" y="13" width="16" height="7" rx="2"/><path d="M8 7.5h.01M8 16.5h.01"/></g><text x="316" y="245" class="f-ink td" font-size="15" font-weight="700" text-anchor="start" data-x0="316" data-x1="486" data-y1="800"><tspan x="316" dy="0">Local models</tspan></text><text x="282" y="270" class="f-mut tb" font-size="12.5" font-weight="400" text-anchor="start" data-x0="282" data-x1="486" data-y1="800"><tspan x="282" dy="0">Run locally,</tspan><tspan x="282" dy="16.2">no cloud</tspan></text><rect x="28" y="310" width="226" height="84" rx="14" class="f-surf s-line" stroke-width="1.5"/><circle cx="54" cy="336" r="14" class="f-pub"/><g transform="translate(46.3 328.3) scale(0.6417)" class="nf s-on" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3"/><path d="M7.5 15h9"/></g><text x="78" y="341" class="f-ink td" font-size="15" font-weight="700" text-anchor="start" data-x0="78" data-x1="248" data-y1="800"><tspan x="78" dy="0">Measurement</tspan></text><text x="44" y="366" class="f-mut tb" font-size="12.5" font-weight="400" text-anchor="start" data-x0="44" data-x1="248" data-y1="800"><tspan x="44" dy="0">The same sample,</tspan><tspan x="44" dy="16.2">many configurations</tspan></text><rect x="266" y="310" width="226" height="84" rx="14" class="f-surf s-line" stroke-width="1.5"/><circle cx="292" cy="336" r="14" class="f-pub"/><g transform="translate(284.3 328.3) scale(0.6417)" class="nf s-on" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></g><text x="316" y="341" class="f-ink td" font-size="15" font-weight="700" text-anchor="start" data-x0="316" data-x1="486" data-y1="800"><tspan x="316" dy="0">Cycle record</tspan></text><text x="282" y="366" class="f-mut tb" font-size="12.5" font-weight="400" text-anchor="start" data-x0="282" data-x1="486" data-y1="800"><tspan x="282" dy="0">Cards, runs,</tspan><tspan x="282" dy="16.2">gate decisions</tspan></text><line x1="96" y1="408" x2="96" y2="452" class="s-mut" stroke-width="2" stroke-linecap="round" marker-end="url(#f5-ar)"/><text x="114" y="434" class="f-mut tb" font-size="13.5" font-weight="500" text-anchor="start" data-x0="114" data-x1="504" data-y1="800"><tspan x="114" dy="0">Every 15 minutes</tspan></text><rect x="16" y="456" width="488" height="72" rx="14" class="f-gatet s-gate" stroke-width="1.5"/><circle cx="52" cy="492" r="19" class="f-gate"/><g transform="translate(41.55 481.55) scale(0.8708)" class="nf s-on" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6z"/><path d="M9 12l2.2 2.2L15.5 10"/></g><text x="84" y="488" class="f-gatex td" font-size="17" font-weight="700" text-anchor="start" data-x0="84" data-x1="500" data-y1="800"><tspan x="84" dy="0">Publishing gate</tspan></text><text x="84" y="510" class="f-ink tb" font-size="13.5" font-weight="400" text-anchor="start" data-x0="84" data-x1="500" data-y1="800"><tspan x="84" dy="0">Five checks and a test every night.</tspan></text><line x1="96" y1="528" x2="96" y2="566" class="s-mut" stroke-width="2" stroke-linecap="round" marker-end="url(#f5-ar)"/><rect x="16" y="570" width="488" height="176" rx="14" class="f-surf s-line" stroke-width="1.5"/><circle cx="52" cy="602" r="18" class="f-pub"/><g transform="translate(42.1 592.1) scale(0.825)" class="nf s-on" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3.2 3.2 3.2 14.8 0 18M12 3c-3.2 3.2-3.2 14.8 0 18"/></g><text x="82" y="608" class="f-ink td" font-size="18" font-weight="700" text-anchor="start" data-x0="82" data-x1="500" data-y1="800"><tspan x="82" dy="0">Public repository</tspan></text><rect x="32" y="630" width="278" height="30" rx="15.0" class="f-okt s-ok" stroke-width="1.2"/><g transform="translate(42 637.0) scale(0.6667)" class="nf s-okx" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text x="64" y="649.42" class="f-okx tb" font-size="13" font-weight="600" text-anchor="start" data-x0="64" data-x1="304" data-y1="800"><tspan x="64" dy="0">Documentation and progress</tspan></text><rect x="32" y="666" width="296" height="30" rx="15.0" class="f-surf s-line" stroke-width="1.2"/><g transform="translate(42 673.0) scale(0.6667)" class="nf s-ink" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></g><text x="64" y="685.42" class="f-ink tb" font-size="13" font-weight="600" text-anchor="start" data-x0="64" data-x1="322" data-y1="800"><tspan x="64" dy="0">Hypothesis cards and results</tspan></text><rect x="338" y="666" width="154" height="30" rx="15.0" class="f-surf s-line" stroke-width="1.2"/><g transform="translate(348 673.0) scale(0.6667)" class="nf s-ink" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></g><text x="370" y="685.42" class="f-ink tb" font-size="13" font-weight="600" text-anchor="start" data-x0="370" data-x1="486" data-y1="800"><tspan x="370" dy="0">Project site</tspan></text><rect x="32" y="702" width="242" height="30" rx="15.0" class="f-surf s-line" stroke-width="1.2"/><g transform="translate(42 709.0) scale(0.6667)" class="nf s-ink" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></g><text x="64" y="721.42" class="f-ink tb" font-size="13" font-weight="600" text-anchor="start" data-x0="64" data-x1="268" data-y1="800"><tspan x="64" dy="0">Reference project card</tspan></text><text x="16" y="776" class="f-mut tb" font-size="13" font-weight="400" text-anchor="start" data-x0="16" data-x1="504" data-y1="800"><tspan x="16" dy="0">Green works, the rest is planned. The full state</tspan><tspan x="16" dy="17.6">of the work is in the last diagram.</tspan></text></svg>