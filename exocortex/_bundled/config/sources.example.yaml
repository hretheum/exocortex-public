# config/sources.yaml — F6.1.5 vault watcher + F6.2.x adapter configuration.
#
# This is the single source of truth for "what to capture and where it goes".
# The vault watcher (workers/vault_watcher.py) reads `vault_watch` to learn
# which folders to watch and what source_type to assign per folder.
#
# RSS adapter (F6.2.1) reads `rss.feeds` and POSTs each new item to the
# capture API as source_type=rss-frp.
#
# Gmail adapter (F6.2.2) reads `gmail` for label + history filters.

# ─────────────────────────── F6.1.5 vault watcher ───────────────────────────
#
# Each entry below is a directory inside VAULT_PATH that the watcher monitors
# for created/modified .md files. Per-folder source_type drives F6.3 routing.
#
# default_source_type fires when no folder-specific rule matches.

vault_watch:
  default_source_type: quick-note

  watch:
    - path: "_source/work"
      source_type: article
      domain: work
      # Watcher only picks up clipper-style _source/work/article-* and
      # _source/work/email-* files here; meeting-notes/ has its own entry
      # below (F34 — was hardcoded in workers/ingest.py, now configured).
      include_patterns:
        - "article-*.md"
        - "email-*.md"
        - "github-*.md"
        - "linkedin-*.md"

    - path: "_source/work/meeting-notes"  # F34 — Fireflies meeting transcripts
      source_type: work-meeting-note
      domain: work
      include_patterns:
        - "*.md"

    - path: "_source/work/acme/CoE"  # ACME Center of Excellence documentation
      source_type: acme-document
      domain: work
      include_patterns:
        - "*.md"

    # ── F33: vault-note / vault-backlog folders (docs/architecture/
    # exocortex/k12/architektura-procesorow-vault.md) — the ~1620 files
    # under source/ that predate this ingest path entirely, moved into
    # this _source/ layout by the companion "przenosiny" task. Whole-folder
    # watch (*.md), not clipper-style filename filters — these are the
    # vault owner's own prose/backlog, not web-clipper output.
    - path: "_source/work/globex"
      source_type: vault-note
      domain: work
      include_patterns:
        - "*.md"

    - path: "_source/work/architecture"
      source_type: vault-note
      domain: work
      include_patterns:
        - "*.md"

    - path: "_source/work/tooling"
      source_type: vault-note
      domain: work
      include_patterns:
        - "*.md"

    - path: "_source/work/diff-machine"
      source_type: vault-note
      domain: work
      include_patterns:
        - "*.md"

    - path: "_source/work/howto"
      source_type: vault-note
      domain: work
      include_patterns:
        - "*.md"

    - path: "_source/backlog/second-brain"
      source_type: vault-backlog
      domain: work
      include_patterns:
        - "*.md"

    - path: "_source/backlog/tickets"
      source_type: vault-backlog
      domain: work
      include_patterns:
        - "*.md"

    - path: "_source/backlog/globex-roadmap"
      source_type: vault-backlog
      domain: work
      include_patterns:
        - "*.md"

    - path: "_source/prv/kukbuk"          # personal recipes — recipe type
      source_type: recipe                # already exists, zero new code (F6)
      domain: cook
      include_patterns:
        - "*.md"

    - path: "_source/3d"
      source_type: article
      domain: 3d
      include_patterns:
        - "article-*.md"
        - "model-*.md"

    - path: "_source/cook"
      source_type: recipe
      domain: cook
      include_patterns:
        - "recipe-*.md"
        - "article-*.md"

    - path: "_source/papers"
      source_type: arxiv
      domain: papers
      include_patterns:
        - "arxiv-*.md"

    - path: "_source/frp"
      source_type: frp-source
      domain: frp
      include_patterns:
        - "story-*.md"

    - path: "_source/priv"
      source_type: personal-article
      domain: priv
      include_patterns:
        - "article-*.md"

    - path: "_inbox"                  # Catch-all for mobile quick notes
      source_type: quick-note
      domain: null                    # F6.3 inbox processor classifies later
      include_patterns:
        - "*.md"

# ─────────────────────────── F6.2.1 RSS adapter ───────────────────────────
# Hourly systemd timer fetches each feed; per item POST → /capture with
# source_type=rss-frp + raw RSS metadata. Idempotent on uri.
rss:
  default_source_type: rss-frp
  feeds:
    # Flash fiction (excerpt-only — F8.7.x HTML scrape extension may add full text)
    - name: "365tomorrows"
      url: "https://www.365tomorrows.com/feed/"
      source_name: "365tomorrows"

    # Mixed full/excerpt
    - name: "Clarkesworld"
      url: "https://clarkesworldmagazine.com/feed/"
      source_name: "Clarkesworld"

    # Full content RSS (verified 2026-05-03 — 100% entries z <content:encoded>)
    - name: "Solarpunk Magazine"
      url: "https://solarpunkmagazine.com/feed/"
      source_name: "Solarpunk Magazine"
    - name: "Strange Horizons"
      url: "https://strangehorizons.com/feed/"
      source_name: "Strange Horizons"
    - name: "Beneath Ceaseless Skies"
      url: "https://www.beneath-ceaseless-skies.com/feed/"
      source_name: "Beneath Ceaseless Skies"
    - name: "Tor.com"
      url: "https://www.tor.com/feed/"
      source_name: "Tor.com"

    # Removed 2026-05-03: Vice Terraform vertical zamknięty po Vice Magazine
    # reorganization 2023-2024. RSS endpoint zwraca 404 HTML page,
    # feedparser SAXParseException. Replaced przez Strange Horizons +
    # Beneath Ceaseless Skies + Tor.com (similar caliber, full content RSS).
    # Lightspeed Magazine evaluated ale RSS feed jest pusty (subscription-only
    # publishing).

# ─────────────────────────── F8.8 Gmail newsletter adapter ──────────────────
# Read-only newsletter aggregator. User's Gmail filter rules auto-apply the
# label to incoming branżowe newsletters (substack/beehiiv/AI report etc).
# The pipeline polls + ingests + synthesizes; it never writes back to Gmail
# (remove_label_after_capture: false → label persists for user-side cleanup).
#
# Mode "newsletter" (F8.8): per-message ingestion, source_type=newsletter,
# full body extraction (HTML → trafilatura markdown), one capture per email.
# Mode "thread" (F6.2.2 legacy): per-thread aggregation for work email
# (gmail-thread source_type, snippets only, NIE used after F8.8 — kept as
# code path in case work email synthesis is re-enabled).
gmail:
  oauth_token_path: "~/.config/second-brain/gmail_token.json"
  oauth_client_secret_path: "~/.config/second-brain/gmail_client_secret.json"
  mode: "newsletter"
  # Label name is exact-match (case-insensitive). User's Gmail filter rules
  # auto-apply this label to branżowe newsletter senders.
  label: "Read Later"
  source_type: newsletter
  # Read-only consumer — never call labels.modify or messages.trash.
  remove_label_after_capture: false
  # Initial backfill scope (F8.8.7) — Gmail q-syntax. The label is applied
  # separately via labelIds (Gmail API), so the query only needs the date
  # filter. Mixing label: in q AND labelIds gives 0 results (Gmail oddity).
  backfill_query: "newer_than:30d"
  poll_intervals_utc:
    - "06:00"
    - "12:00"
    - "18:00"
    - "22:00"
