# config/sources.yaml: vault watcher and source adapter configuration.
#
# The single source of truth for "what to capture and where it goes".
# The vault watcher (exocortex/vault_watcher.py) reads `vault_watch` to learn
# which folders to watch and which source_type each folder gets.
# The RSS adapter reads `rss.feeds` and posts each new item to the Capture API.
# The Gmail adapter reads `gmail` for the label and history filters.
#
# Folder names below are an example layout; adjust them to your vault.

# --- vault watcher ---
# Each entry is a folder inside VAULT_PATH watched for new or changed .md
# files. The per-folder source_type drives routing to a processor.
# default_source_type applies when no folder rule matches.
vault_watch:
  default_source_type: quick-note
  watch:
    - path: "_source/work"
      source_type: article
      domain: work
      # Only web-clipper style files at this level; meeting notes have their own entry.
      include_patterns:
        - "article-*.md"
        - "email-*.md"
        - "github-*.md"
        - "linkedin-*.md"
    - path: "_source/work/meeting-notes"  # meeting transcripts
      source_type: work-meeting-note
      domain: work
      include_patterns:
        - "*.md"
    # Your own prose documents and backlogs, watched as whole folders.
    - path: "_source/work/projects"
      source_type: vault-note
      domain: work
      include_patterns:
        - "*.md"
    - path: "_source/work/architecture"
      source_type: vault-note
      domain: work
      include_patterns:
        - "*.md"
    - path: "_source/backlog"
      source_type: vault-backlog
      domain: work
      include_patterns:
        - "*.md"
    - path: "_source/prv/recipes"        # personal recipes
      source_type: recipe
      domain: cook
      include_patterns:
        - "*.md"
    - path: "_source/3d"
      source_type: article
      domain: 3d
      include_patterns:
        - "article-*.md"
        - "model-*.md"
    - path: "_source/cook"
      source_type: recipe
      domain: cook
      include_patterns:
        - "recipe-*.md"
        - "article-*.md"
    - path: "_source/papers"
      source_type: arxiv
      domain: papers
      include_patterns:
        - "arxiv-*.md"
    - path: "_source/frp"
      source_type: frp-source
      domain: frp
      include_patterns:
        - "story-*.md"
    - path: "_source/priv"
      source_type: personal-article
      domain: priv
      include_patterns:
        - "article-*.md"
    - path: "_inbox"                     # catch-all for quick notes from a phone
      source_type: quick-note
      domain: null                       # the inbox processor classifies later
      include_patterns:
        - "*.md"

# --- RSS adapter ---
# An hourly timer fetches each feed and posts every item to /capture with
# source_type=rss-frp and the raw RSS metadata. Idempotent on the item URI.
rss:
  default_source_type: rss-frp
  feeds:
    # Flash fiction (excerpt only)
    - name: "365tomorrows"
      url: "https://www.365tomorrows.com/feed/"
      source_name: "365tomorrows"
    # Mixed full text and excerpts
    - name: "Clarkesworld"
      url: "https://clarkesworldmagazine.com/feed/"
      source_name: "Clarkesworld"
    # Full content RSS
    - name: "Solarpunk Magazine"
      url: "https://solarpunkmagazine.com/feed/"
      source_name: "Solarpunk Magazine"
    - name: "Strange Horizons"
      url: "https://strangehorizons.com/feed/"
      source_name: "Strange Horizons"
    - name: "Beneath Ceaseless Skies"
      url: "https://www.beneath-ceaseless-skies.com/feed/"
      source_name: "Beneath Ceaseless Skies"
    - name: "Tor.com"
      url: "https://www.tor.com/feed/"
      source_name: "Tor.com"
    # arXiv returns Atom, which feedparser reads without code changes. The
    # abstract arrives as `summary` and is enough for the arxiv processor,
    # which rates relevance 1-10. source_type is overridden per feed, so the
    # scorer routes these items to processors/arxiv.py and wiki/papers/.
    - name: "arXiv cs.CL"
      url: "http://export.arxiv.org/api/query?search_query=cat:cs.CL&sortBy=submittedDate&sortOrder=descending&max_results=30"
      source_name: "arXiv cs.CL"
      source_type: arxiv

# --- Gmail newsletter adapter ---
# Read-only newsletter aggregator. A Gmail filter applies the label to
# incoming newsletters; the pipeline polls, ingests and synthesises, and never
# writes back to Gmail (remove_label_after_capture: false).
#
# Mode "newsletter": one capture per email, full body extracted (HTML to
# markdown with trafilatura), source_type=newsletter.
# Mode "thread" (legacy): per-thread aggregation of work email, snippets only.
gmail:
  oauth_token_path: "~/.config/exocortex/gmail_token.json"
  oauth_client_secret_path: "~/.config/exocortex/gmail_client_secret.json"
  mode: "newsletter"
  # Exact label name, case-insensitive.
  label: "Read Later"
  source_type: newsletter
  # Read-only consumer: never call labels.modify or messages.trash.
  remove_label_after_capture: false
  # Initial backfill scope in Gmail query syntax. The label is applied through
  # labelIds, so the query only needs the date filter (mixing label: in q with
  # labelIds returns nothing).
  backfill_query: "newer_than:30d"
  poll_intervals_utc:
    - "06:00"
    - "12:00"
    - "18:00"
    - "22:00"
