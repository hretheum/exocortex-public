# Auto-tag taxonomy: a closed vocabulary for tagging work action items.
# Scope: action items in wiki/work/meetings/*.md.
# No new tags are allowed at run time. Source of truth for the auto-tagging
# LLM constraint and its validation. All organisations are fictional.

clients:  # match config/projects.yaml
  - acme
  - globex
  - initech
  - example-company

activities:
  - presales
  - delivery
  - new-biz
  - leadership
  - design
  - ai
  - engineering

status_flags:  # opt-in, only with explicit cues in the task text
  - urgent
  - blocker
  - waiting

# Validation rules:
# - lowercase kebab-case
# - no duplicates across categories
# - the LLM may only return tags from this list
