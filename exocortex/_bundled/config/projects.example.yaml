# config/projects.yaml: registry of clients, sub-projects, people and meeting types.
# Single source of truth for exocortex/classifier.py.
#
# Every organisation and person below is fictional.
#
# Schema:
#   clients: list[Client]
#     Client:
#       slug: str          # canonical kebab-case slug, used in wiki paths
#       display_name: str  # human-readable name
#       aliases: list[str] # filename slug fragments that identify this client
#       type: external | internal
#       domain: work       # reserved for multi-domain logic
#       projects: list[Project]  # optional; a {slug}-general fallback always exists
#         Project:
#           slug: str             # client_slug + "-" + project token
#           display_name: str
#           aliases: list[str]    # filename slug tokens or phrases to match
#           body_match: list[str] # optional keywords matched in the meeting overview
#           min_meetings: int     # optional threshold for a separate page (default 3)
#
# Primary match is the filename slug. The body overlay applies only when the
# project resolved to {client}-general. LLM-classified tags override the
# deterministic layer only with confidence >= 0.7.

clients:

  - slug: acme
    display_name: Acme Corp
    aliases: [acme, acme-corp, sync-acme]
    type: external
    domain: work
    projects:
      - slug: acme-platform
        display_name: Customer platform
        aliases: [acme-platform, platform-review]
        body_match: ["customer platform"]
      - slug: acme-mobile
        display_name: Mobile app
        aliases: [acme-mobile, mobile-app-review]
        body_match: ["mobile app"]
      - slug: acme-general
        display_name: Acme — general
        aliases: [sync-acme, acme]
        body_match: []

  - slug: globex
    display_name: Globex
    aliases: [globex, sync-globex]
    type: external
    domain: work
    projects:
      - slug: globex-portal
        display_name: Partner portal
        aliases: [globex-portal, partner-portal]
        body_match: ["partner portal"]
      - slug: globex-general
        display_name: Globex — general
        aliases: [sync-globex, globex]
        body_match: []

  - slug: initech
    display_name: Initech
    aliases: [initech, initech-intro]
    type: external
    domain: work
    projects:
      - slug: initech-general
        display_name: Initech — general
        aliases: [initech]
        body_match: []

  - slug: example-company
    display_name: Example Company (internal)
    aliases: [example-company, internal]
    type: internal
    domain: work
    projects:
      - slug: example-company-design-leadership
        display_name: Design leadership weekly
        aliases: [design-leadership, design-leadership-weekly]
      - slug: example-company-presales
        display_name: Presales / new business
        aliases: [presales, new-biz, offering]
      - slug: example-company-general
        display_name: Example Company — other internal
        aliases: []

# Person tags: slugs that name people, not projects.
# Maps a tag or filename alias to person_slug in wiki/work/people/.
person_tags:
  anowak:
    person_slug: anowak
    display_name: Anna Nowak
    aliases: [anowak, anowak-biweekly]
  jkowalski:
    person_slug: jkowalski
    display_name: Jan Kowalski
    aliases: [1on1-user-colleague, jkowalski-weekly]

# Type tags: slugs describing the kind of meeting (not a project, not a person).
# They create by-tag/ pages and set meeting.frontmatter.meeting_type.
type_tags:
  - sync           # recurring client status meeting
  - weekly         # synonym of sync for some clients
  - presales       # sales / business development
  - internal       # internal, no client
  - leadership     # board / leadership
  - 1on1           # one-on-one
  - workshop       # workshop
  - kickoff        # kickoff meeting
  - debriefing     # post-mortem / review
